<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AutoVerse | Contact</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="logo">AUTOVERSE</div><nav><a href="index.html">Home</a><a href="about.html">About Us</a><a href="products.html">Products</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a></nav></header>
<section class="page-title"><div class="eyebrow">AutoVerse</div><h1>Contact Us</h1><p>Have a question? Send us a message.</p></section>
<section class="contact-container">
<div class="contact-info"><h2>Get In Touch</h2><p><strong>Phone:</strong> +63 912 345 6789</p><p><strong>Email:</strong> info@autoverse.com</p><p><strong>Location:</strong> Manila, Philippines</p><p><strong>Business Hours:</strong> Monday - Saturday, 9:00 AM - 6:00 PM</p></div>
<form class="contact-form" onsubmit="sendMessage(event)">
<label for="contact-name">Name</label><input type="text" id="contact-name" required>
<label for="contact-email">Email</label><input type="email" id="contact-email" required>
<label for="subject">Subject</label><input type="text" id="subject" required>
<label for="contact-message">Message</label><textarea id="contact-message" rows="6" required></textarea>
<button type="submit" class="button">Send Message</button>
</form></section>
<footer><p>&copy; 2026 AutoVerse. <span>Drive with confidence.</span></p></footer>
<script>
function sendMessage(event){event.preventDefault();alert("Your message has been sent!");document.querySelector(".contact-form").reset();}
</script>
</body></html>
